<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好课优选教育面试登记表</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #e9f5e9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid #b2e0b2;
        }

        h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-style: italic;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px;
            border: 1px solid #b2e0b2;
            border-radius: 10px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: #4CAF50;
            outline: none;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .error.hidden {
            display: none;
        }

        .icon {
            display: block;
            margin: 0 auto 10px;
            width: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>欢迎来到好课优选教育</h2>
    <img src="{% static '笑脸.svg' %}" alt="icon" class="icon"/>
    <p>青青子衿，悠悠我心；请填此表，期待相见。</p>
    <form action="{% url 'interview_registration' %}" method="POST" onsubmit="return validateForm()">
        {% csrf_token %}

        <label for="date">面试日期:</label>
        {{ form.date }} 
        <span class="error hidden" id="dateError">内容不能为空</span>

        <label for="name">姓名:</label>
        {{ form.name }} 
        <span class="error hidden" id="nameError">内容不能为空</span>

        <label for="gender">性别:</label>
        {{ form.gender }}  
        <span class="error hidden" id="genderError">内容不能为空</span>

        <label for="contact">联系方式:</label>
        {{ form.contact }} 
        <span class="error hidden" id="contactError">内容不能为空</span>
        <span class="error hidden" id="contactFormatError">手机号格式不正确</span>

        <label for="position">应聘岗位:</label>
        {{ form.position }} 
        <span class="error hidden" id="positionError">内容不能为空</span>

        <label for="interviewer">约面人:</label>
        {{ form.interviewer }} 
        <span class="error hidden" id="interviewerError">内容不能为空</span>

        <label for="channel">应聘渠道:</label>
        {{ form.channel }}  
        <span class="error hidden" id="channelError">内容不能为空</span>

        <input type="submit" value="提交登记">
    </form>
    <div class="footer">
        &copy; 2024 好课优选面试登记
    </div>
</div>

<script>
    // 自动填充当前日期
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.querySelector('input[type="date"]'); // 确保选择正确的日期输入字段
        if (dateInput) {
            dateInput.value = today; // 设置当前日期
        }
    });

    function validateForm() {
        let isValid = true;

        // 清除之前的错误信息
        document.querySelectorAll('.error').forEach(error => {
            error.classList.add('hidden');
        });

        // 验证每个字段
        const fields = [
            { id: 'date', errorId: 'dateError' },
            { id: 'name', errorId: 'nameError' },
            { id: 'gender', errorId: 'genderError' },
            { id: 'contact', errorId: 'contactError' },
            { id: 'position', errorId: 'positionError' },
            { id: 'interviewer', errorId: 'interviewerError' },
            { id: 'channel', errorId: 'channelError' }
        ];

        fields.forEach(field => {
            const input = document.getElementById(field.id);
            if (!input.value) {
                document.getElementById(field.errorId).classList.remove('hidden');
                isValid = false;
            }
        });

        // 验证手机号格式
        const contactInput = document.getElementById('contact');
        const contactValue = contactInput.value;
        const phoneRegex = /^1[3-9]\d{9}$/; // 简单的手机号格式验证（中国大陆）

        if (contactValue && !phoneRegex.test(contactValue)) {
            document.getElementById('contactFormatError').classList.remove('hidden');
            isValid = false;
        }

        return isValid;
    }
</script>

</body>
</html>
